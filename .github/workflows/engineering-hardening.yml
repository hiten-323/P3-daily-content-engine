name: Engineering Hardening

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    name: Governance, learning and publishing contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install rendering fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core fonts-liberation

      - name: Run governance regression suite
        run: |
          python tests/test_render_safety.py
          python tests/test_measurement_integrity.py
          python tests/test_objective_measurement_integrity.py
          python tests/test_learning_evidence_guard.py
          python tests/test_growth_director_spec.py
          python tests/test_publish_gate.py
          python tests/test_publish_contract.py
          python tests/test_psychology_governance.py
          python tests/test_scroller_psychology.py
          python tests/test_fallback_safety.py
          python tests/test_config_drift.py

      - name: Compile Python sources
        run: |
          python -m compileall -q content_generator config tests

      - name: Run pytest when available
        run: |
          python -m pytest tests/ -q
