# Purity Beans — Autonomous Daily Pipeline
#
# Runs every day at 06:00 IST (00:30 UTC).
# Triggered automatically by GitHub Actions cron — no server required.
#
# What it does:
#   1. Checks out the repo and installs dependencies
#   2. Runs the full autonomous pipeline:
#      research → strategy → content → editorial → objectives →
#      memory → save → snapshot → nurture → founder WhatsApp report
#   3. Commits output/ changes back to the repo (metrics DB, archive)
#   4. On failure, sends an alert via ALERT_WEBHOOK_URL
#
# Required secrets (GitHub → Settings → Secrets → Actions):
#   GEMINI_API_KEY       — primary LLM
#   GROQ_API_KEY         — fallback LLM
#   OPENROUTER_API_KEY   — final fallback LLM
#   FOUNDER_PHONE        — your WhatsApp number (+91XXXXXXXXXX)
#   WHATSAPP_TOKEN       — Meta Cloud API bearer token
#   WHATSAPP_PHONE_ID    — WhatsApp Business phone number ID
#   ALERT_WEBHOOK_URL    — Slack/Discord webhook for failure alerts (optional)
#
# Optional secrets (social publishing):
#   HF_TOKEN             — Hugging Face token for free FLUX.1-schnell image generation
#                          Get free token at: huggingface.co → Settings → Access Tokens
#   FLUX_API_KEY         — fal.ai image generation (paid, higher quality)
#
#   LinkedIn:
#   LI_API_ACCESS        — LinkedIn OAuth access token (already added)
#   LI_AUTHOR_URN        — urn:li:person:XXXXX or urn:li:organization:XXXXX
#
#   Instagram:
#   INSTAGRAM_ACCOUNT_ID    — Instagram Business Account ID
#   INSTAGRAM_ACCESS_TOKEN  — Long-lived Page Access Token
#   IMGBB_API_KEY           — Free image hosting for Instagram (api.imgbb.com)
#
#   Facebook:
#   FACEBOOK_PAGE_ID           — Facebook Page ID
#   FACEBOOK_PAGE_ACCESS_TOKEN — Page Access Token (can reuse INSTAGRAM_ACCESS_TOKEN)
#
#   YouTube Shorts:
#   YOUTUBE_CLIENT_ID      — Google OAuth client ID
#   YOUTUBE_CLIENT_SECRET  — Google OAuth client secret
#   YOUTUBE_REFRESH_TOKEN  — Offline refresh token (run: python -m content_generator.publisher.youtube --setup)
#   RUNWAY_API_KEY       — Runway video generation
#   SMTP_USER            — email nurture sequences
#   SMTP_PASS            — email nurture sequences
#   SHOPIFY_STORE_DOMAIN — your-store.myshopify.com
#   SHOPIFY_ADMIN_TOKEN  — Admin API token. Scopes: write_content+read_content
#                          (daily blog publishing); read_orders (optional, for
#                          revenue attribution)
#   SHOPIFY_BLOG_ID      — optional; defaults to the store's first blog
#
# Manual trigger:
#   GitHub UI → Actions → "Purity Beans Daily Pipeline" → Run workflow

name: Purity Beans Daily Pipeline

on:
  schedule:
    # 00:30 UTC = 06:00 IST — GENERATE slot: full pipeline, IG/FB held
    - cron: '30 0 * * *'
    # 02:30 UTC = 08:00 IST — MORNING slot: IG carousel + FB (owner-chosen time)
    - cron: '30 2 * * *'
    # 14:30 UTC = 20:00 IST — EVENING slot: IG reel post + FB (owner-chosen time)
    - cron: '30 14 * * *'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      day_number:
        description: 'Override day number (leave blank for auto)'
        required: false
        default: ''
      force_run:
        description: 'Force run even if already ran today'
        required: false
        default: 'false'

# Opt into Node.js 24 now (Node 20 deprecated June 2026, removed Sept 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Timed publishing: generate at 06:00 IST, Instagram at 08:00 + 20:00 IST
  ENABLE_TIMED_SLOTS: "true"

# Three crons plus manual dispatch can overlap, and every run rebases and
# pushes to the same branch. A manual trigger during a scheduled run raced on
# that push. Queue them instead — never cancel, because a cancelled generate
# slot leaves the publish slots with nothing to post.
concurrency:
  group: purity-beans-daily
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Daily Content Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # needed to push .last_run keep-alive commit

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history needed for day_number calculation
          fetch-depth: 0

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Dependencies ──────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Pillow ships no fonts. Without these the composer falls back to Pillow's
      # bitmap default, which lacks most glyphs — that is what put tofu boxes
      # (▯) into published carousel slides. Don't rely on the runner image
      # happening to include them.
      - name: Install rendering fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core fonts-liberation
          fc-list | grep -ci dejavu || (echo "DejaVu missing after install" && exit 1)

      # ── 4. Restore output/ from cache (metrics DB persists between runs) ─────
      - name: Restore output cache
        uses: actions/cache@v4
        with:
          path: output/
          key: purity-beans-output-${{ runner.os }}
          restore-keys: |
            purity-beans-output-

      - name: Ensure output directory
        run: mkdir -p output

      # ── 5. Force-unlock if requested ─────────────────────────────────────────
      - name: Clear run lock (if force_run)
        if: ${{ github.event.inputs.force_run == 'true' }}
        run: python -m content_generator.scheduler.daily --unlock

      # ── 5b. Pre-publish gate ─────────────────────────────────────────────────
      # Nothing on CI verified the renderer before this existed, so a Linux-only
      # font bug shipped tofu glyphs to the live grid for days. These checks run
      # on the same runner that renders the posts, and block the run rather than
      # publish a defect onto a permanent profile grid.
      - name: Verify render safety and config drift
        run: |
          python tests/test_render_safety.py
          python tests/test_measurement_integrity.py
          python tests/test_growth_director_spec.py
          python tests/test_publish_gate.py
          python tests/test_psychology_governance.py
          python tests/test_config_drift.py

      # ── 6. Run the pipeline ───────────────────────────────────────────────────
      - name: Run autonomous pipeline
        env:
          # LLM providers
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          # Secret is named OPENROUTER_API_TOKEN in this repo
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_TOKEN }}
          DEEPSEEK_API_KEY:    ${{ secrets.DEEPSEEK_API_KEY }}
          CEREBRAS_API_KEY:    ${{ secrets.CEREBRAS_API_KEY }}

          # Founder notifications + WhatsApp nurture
          FOUNDER_PHONE:       ${{ secrets.FOUNDER_PHONE }}
          AISENSY_API_KEY:          ${{ secrets.AISENSY_API_KEY }}
          AISENSY_CAMPAIGN_NAME:    ${{ secrets.AISENSY_CAMPAIGN_NAME }}
          WHATSAPP_TOKEN:      ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID:   ${{ secrets.WHATSAPP_PHONE_ID }}

          # ── SOCIAL PUBLISHING ─────────────────────────────────────────────────
          # LinkedIn (✅ secrets already added — will post on next run)
          LI_API_ACCESS:       ${{ secrets.LI_API_ACCESS }}
          LI_AUTHOR_URN:       ${{ secrets.LI_AUTHOR_URN }}

          # Instagram Business (add INSTAGRAM_ACCOUNT_ID + INSTAGRAM_ACCESS_TOKEN)
          INSTAGRAM_ACCOUNT_ID:      ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN:    ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          # Required for Instagram image hosting (free: api.imgbb.com)
          IMGBB_API_KEY:             ${{ secrets.IMGBB_API_KEY }}
          # Shoppable posts (optional): set ONE after enabling Instagram Shopping.
          # IG_PRODUCT_ID = tag every post with one product; or
          # IG_CATALOG_ID = engine resolves a product per post by keyword.
          IG_PRODUCT_ID:             ${{ secrets.IG_PRODUCT_ID }}
          IG_CATALOG_ID:             ${{ secrets.IG_CATALOG_ID }}
          # Optional: Cloudinary image hosting (free 25GB/month)
          CLOUDINARY_URL:            ${{ secrets.CLOUDINARY_URL }}

          # Facebook Page (same token as Instagram if same Meta App)
          FACEBOOK_PAGE_ID:          ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}

          # YouTube Shorts (✅ secrets already added — will post on next run)
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

          # ── FAILURE ALERTS ────────────────────────────────────────────────────
          ALERT_WEBHOOK_URL:   ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_EMAIL_TO:      ${{ secrets.ALERT_EMAIL_TO }}

          # ── IMAGE GENERATION ──────────────────────────────────────────────────
          HF_TOKEN:            ${{ secrets.HF_TOKEN }}
          FAL_KEY:             ${{ secrets.FLUX_API_KEY }}
          RUNWAY_API_KEY:      ${{ secrets.RUNWAY_API_KEY }}

          # Optional: email nurture
          SMTP_HOST:           ${{ secrets.SMTP_HOST }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASS:           ${{ secrets.SMTP_PASS }}
          NURTURE_FROM_EMAIL:  ${{ secrets.NURTURE_FROM_EMAIL }}

          # Shopify revenue attribution (names must match revenue_attribution.py)
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_TOKEN:  ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_BLOG_ID:      ${{ secrets.SHOPIFY_BLOG_ID }}

          FORCE_SLOT: ${{ github.event.schedule == '30 0 * * *' && 'generate' || (github.event.schedule == '30 2 * * *' && 'morning' || (github.event.schedule == '30 14 * * *' && 'evening' || '')) }}
          # Config
          WEBSITE_URL:         https://p3online.in
          ENABLE_EDITORIAL_REVIEW: "true"
          ENABLE_WEEKLY_SUMMARY:   "true"
          ENABLE_USAGE_LOG:        "false"
          # Generates blog, stories, yt_short, reel_2 (owner enabled — stories +
          # YouTube Shorts are part of the growth plan; watch TPM in logs)
          ENABLE_EXTENDED_CONTENT: "true"
          PYTHONIOENCODING:        utf-8
          # Optional day override from manual trigger
          OVERRIDE_DAY_NUMBER: ${{ github.event.inputs.day_number }}

        run: |
          # Both branches used to run the identical command, so the day_number
          # input was accepted by the UI and thrown away. --day now exists.
          set -o pipefail
          if [ -n "$OVERRIDE_DAY_NUMBER" ]; then
            python -m content_generator.scheduler.daily --now --day "$OVERRIDE_DAY_NUMBER" | tee run_result.json
          else
            python -m content_generator.scheduler.daily --now | tee run_result.json
          fi

      # ── 6b. A green check must mean something was published ──────────────────
      # An expired Instagram token, an exhausted LLM quota or a dead image host
      # all produce a run that completes and posts nothing. Without this the
      # result is a green tick and silence — the same failure as a process
      # reporting "online" while doing no work.
      - name: Verify something was actually published
        if: success()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json, os, re, sys, urllib.request
          raw = open("run_result.json", encoding="utf-8", errors="ignore").read()
          m = re.search(r"\{.*\}\s*$", raw, re.S)      # the printed result block
          if not m:
              print("::warning::could not parse pipeline result — skipping check")
              sys.exit(0)
          r = json.loads(m.group(0))
          if r.get("_skipped") or r.get("skipped"):
              print(f"::notice::run skipped ({r.get('reason')}) — nothing to verify")
              sys.exit(0)
          # If the key is absent entirely the pipeline predates this contract —
          # warn, do not fail. A verification step that fails on its own missing
          # input becomes the outage it was written to detect. (The first cut of
          # this checked a key that run_full_pipeline never returned, and would
          # have failed every run from the day it shipped.)
          if "published_platforms" not in r:
              print("::warning::result carries no published_platforms key — "
                    "cannot verify publishing; check the pipeline contract")
              sys.exit(0)
          published = r.get("published_platforms") or []
          print(f"published_platforms: {published}")
          if published:
              sys.exit(0)
          msg = ("PURITY BEANS: pipeline completed but published to NO platform. "
                 "Check token expiry (Instagram/Facebook), LLM quota, image host.")
          print(f"::error::{msg}")
          hook = os.environ.get("ALERT_WEBHOOK_URL")
          if hook:
              try:
                  urllib.request.urlopen(urllib.request.Request(
                      hook, data=json.dumps({"text": msg}).encode(),
                      headers={"Content-Type": "application/json"}), timeout=15)
              except Exception as e:
                  print(f"::warning::alert webhook failed: {e}")
          sys.exit(1)
          PY

      # ── 7. Save output/ back to cache ─────────────────────────────────────────
      - name: Save output cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/
          key: purity-beans-output-${{ runner.os }}-${{ github.run_id }}

      # ── 8. Upload artifacts (content + logs for this run) ────────────────────
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purity-beans-day-${{ github.run_number }}
          path: |
            output/*.json
            output/archive/
          retention-days: 90

      # ── 9. Persist learning data + keep repo active ────────────────────────────
      # GitHub pauses cron workflows after 60 days of repo inactivity.
      # This commit bumps a timestamp daily AND persists the learning-engine
      # state (performance log, published posts, follower snapshots) so the
      # continuous learning loop survives across CI runs.
      - name: Persist learning data and keep repo active
        if: success()
        run: |
          git config user.name  "Purity Beans Engine"
          git config user.email "engine@puritybeans.auto"
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) run #${{ github.run_number }}" >> .last_run
          git add .last_run
          git add -f output/learning/ 2>/dev/null || true
          # Persist today's content + images + slot locks so the later
          # publish-slot runs (08:00 / 20:00 IST) can load them.
          # Clean creative files older than 7 days to limit repo growth.
          find output/creative -type f -mtime +7 -delete 2>/dev/null || true
          git add -f "output/content_$(date -u +%Y-%m-%d).json" 2>/dev/null || true
          git add -f output/creative/ 2>/dev/null || true
          git add -f output/reports/ 2>/dev/null || true
          git add -f output/.running* 2>/dev/null || true
          git pull --rebase --autostash || true
          git diff --staged --quiet || git commit -m "chore: run ${{ github.run_number }} — content + learning data [skip ci]"
          # This push is NOT optional. The 08:00 and 20:00 publish slots load
          # today's content, images and slot locks from the repo, so a failed
          # push means those runs find nothing and the day publishes nothing —
          # while this job reports success. `|| true` hid exactly that. Retry
          # once against a moved remote, then fail loudly.
          if ! git push; then
            echo "push rejected — rebasing on the remote and retrying"
            git pull --rebase --autostash || true
            git push || {
              echo "::error::Could not push run artefacts. The 08:00/20:00 publish slots will have no content to post."
              exit 1
            }
          fi

      # ── 10. On failure: alert ─────────────────────────────────────────────────
      - name: Alert on failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl -s -X POST "$ALERT_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"PURITY BEANS PIPELINE FAILED\\nRun: ${{ github.run_number }}\\nDate: $(date)\\nLogs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi
          echo "Pipeline failed — check logs at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
