# Purity Beans — Autonomous Daily Pipeline
# Canonical slots: 06:00 IST generate, 10:00 IST morning, 22:00 IST evening.
# Git is authoritative persistent state. Actions cache is intentionally not used for output state.

name: Purity Beans Daily Pipeline

on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '30 4 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Manual slot to execute — never infer from wall-clock time'
        required: true
        type: choice
        options:
          - generate
          - morning
          - evening
      day_number:
        description: 'Override day number (leave blank for auto)'
        required: false
        default: ''
      force_run:
        description: 'Force run even if already ran today'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ENABLE_TIMED_SLOTS: "true"
  FORCE_SLOT: ${{ github.event.schedule == '30 0 * * *' && 'generate' || (github.event.schedule == '30 4 * * *' && 'morning' || (github.event.schedule == '30 16 * * *' && 'evening' || github.event.inputs.slot || '')) }}

concurrency:
  group: purity-beans-daily
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Daily Content Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install rendering fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core fonts-liberation
          fc-list | grep -ci dejavu || (echo "DejaVu missing after install" && exit 1)

      - name: Ensure output directory
        run: mkdir -p output

      - name: Clear run lock (if force_run)
        if: ${{ github.event.inputs.force_run == 'true' }}
        run: python -m content_generator.scheduler.daily --unlock

      - name: Verify render, measurement, governance and workflow contracts
        run: |
          # ONE runner over BOTH styles. Ten suites were pytest-style and
          # invoked by nobody; running them as scripts executes no test
          # function at all, so they would have passed vacuously. The
          # script-style suites now expose test_main(), so pytest collects
          # every suite in tests/ and nothing is silently skipped.
          pytest -q tests/

      - name: Meta token soft-check (generate)
        if: ${{ success() && env.FORCE_SLOT == 'generate' }}
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          account=os.environ.get("INSTAGRAM_ACCOUNT_ID"); token=os.environ.get("INSTAGRAM_ACCESS_TOKEN")
          if not account or not token:
              print("::warning::Instagram credentials unavailable; generate continues; publish slots fail closed."); raise SystemExit(0)
          url=f"https://graph.facebook.com/v24.0/{urllib.parse.quote(account,safe='')}?fields=id"
          try:
              req=urllib.request.Request(url,headers={"Authorization":f"Bearer {token}"})
              with urllib.request.urlopen(req,timeout=15) as r: payload=json.load(r)
              print("::notice::Meta token responds." if str(payload.get("id"))==account else "::warning::Unexpected Meta account id; publish slots will preflight again.")
          except Exception as exc: print(f"::warning::Meta token check failed ({type(exc).__name__}); generate continues.")
          PY

      - name: Verify Meta publishing access
        if: ${{ success() && env.FORCE_SLOT != 'generate' }}
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.parse, urllib.request
          account=os.environ.get("INSTAGRAM_ACCOUNT_ID"); token=os.environ.get("INSTAGRAM_ACCESS_TOKEN")
          if not account or not token: print("::error::Instagram publishing credentials are missing."); sys.exit(1)
          url=f"https://graph.facebook.com/v24.0/{urllib.parse.quote(account,safe='')}?fields=id"
          try:
              req=urllib.request.Request(url,headers={"Authorization":f"Bearer {token}"})
              with urllib.request.urlopen(req,timeout=20) as r: payload=json.load(r)
              if str(payload.get("id"))!=account: raise RuntimeError("unexpected account id")
              print("::notice::Meta publishing preflight passed.")
          except Exception as exc: print(f"::error::Meta publishing preflight failed: {type(exc).__name__}"); sys.exit(1)
          PY

      - name: Run autonomous pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          FOUNDER_PHONE: ${{ secrets.FOUNDER_PHONE }}
          AISENSY_API_KEY: ${{ secrets.AISENSY_API_KEY }}
          AISENSY_CAMPAIGN_NAME: ${{ secrets.AISENSY_CAMPAIGN_NAME }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          LI_API_ACCESS: ${{ secrets.LI_API_ACCESS }}
          LI_AUTHOR_URN: ${{ secrets.LI_AUTHOR_URN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          IG_PRODUCT_ID: ${{ secrets.IG_PRODUCT_ID }}
          IG_CATALOG_ID: ${{ secrets.IG_CATALOG_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FAL_KEY: ${{ secrets.FLUX_API_KEY }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NURTURE_FROM_EMAIL: ${{ secrets.NURTURE_FROM_EMAIL }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_BLOG_ID: ${{ secrets.SHOPIFY_BLOG_ID }}
          # Extended content is founder-policy controlled, never a workflow override.
          # Source: founder_policies.yaml -> content.enable_extended_content.
          WEBSITE_URL: https://p3online.in
          ENABLE_EDITORIAL_REVIEW: "true"
          ENABLE_WEEKLY_SUMMARY: "true"
          ENABLE_USAGE_LOG: "false"
          PYTHONIOENCODING: utf-8
          OVERRIDE_DAY_NUMBER: ${{ github.event.inputs.day_number }}
        run: |
          set -o pipefail
          if [ -n "$OVERRIDE_DAY_NUMBER" ]; then python -m content_generator.scheduler.daily --now --day "$OVERRIDE_DAY_NUMBER" | tee run_result.json; else python -m content_generator.scheduler.daily --now | tee run_result.json; fi

      - name: Verify slot result
        if: success()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          FORCE_SLOT: ${{ env.FORCE_SLOT }}
        run: |
          python - <<'PY'
          import glob,json,os,re,sys,urllib.request
          from pathlib import Path
          slot=os.environ.get("FORCE_SLOT","").strip()
          if slot not in {"generate","morning","evening"}: print("::error::No explicit execution slot; refusing wall-clock guessing."); sys.exit(1)
          def alert(msg):
              print(f"::error::{msg}")
              hook=os.environ.get("ALERT_WEBHOOK_URL")
              if hook:
                  try: urllib.request.urlopen(urllib.request.Request(hook,data=json.dumps({"text":msg}).encode(),headers={"Content-Type":"application/json"}),timeout=15)
                  except Exception: pass
          if slot=="generate":
              files=sorted(glob.glob("output/content_*.json"),key=lambda p:Path(p).stat().st_mtime,reverse=True)
              if not files: alert("GENERATE completed without a persisted content file."); sys.exit(1)
              print(f"::notice::GENERATE verified — {files[0]}; no publication expected at 06:00 IST."); sys.exit(0)
          raw=Path("run_result.json").read_text(encoding="utf-8",errors="ignore")
          m=re.search(r"\{.*\}\s*$",raw,re.S)
          if not m: alert(f"{slot.upper()} produced no parseable publish result."); sys.exit(1)
          try: result=json.loads(m.group(0))
          except json.JSONDecodeError as exc: alert(f"{slot.upper()} returned invalid JSON: {exc}"); sys.exit(1)
          from content_generator.core.publish_contract import evaluate,format_report
          verdict=evaluate(result); print(format_report(result))
          if verdict["status"]=="missing": alert(f"{slot.upper()} publish contract missing."); sys.exit(1)
          if verdict["ok"]: print(f"::notice::{verdict['status']}: {verdict['detail']}"); sys.exit(0)
          alert(verdict["detail"]); sys.exit(1)
          PY

      # Diagnostics and generated media are retained as Actions artifacts only.
      # Production state is persisted to Git only after the slot result succeeds.
      - name: Upload run diagnostics and creative artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purity-beans-run-${{ github.run_number }}
          path: |
            run_result.json
            output/*.json
            output/reports/
            output/creative/
          if-no-files-found: ignore
          retention-days: 90

      - name: Persist validated state to Git
        if: ${{ success() }}
        run: |
          set -euo pipefail
          git config user.name "Purity Beans Engine"
          git config user.email "engine@puritybeans.auto"
          # Synchronize BEFORE staging generated state. Remote Git is authoritative.
          git pull --rebase --autostash
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) run #${{ github.run_number }}" >> .last_run
          git add .last_run
          git add -f output/learning/ 2>/dev/null || true
          # Creative MUST be committed. Each slot is a separate workflow run on a
          # separate runner, so images written by the 00:30 generate run do not
          # exist on the 04:30 publish runner unless Git carries them. 0d20beb
          # added this line when timed slots landed, for exactly that reason;
          # c345418 removed it to keep media out of Git, and every Instagram
          # image post has failed "no_images" since. The 7-day prune below is
          # what bounds repo growth — you only prune what you keep.
          # Prune on the date in the FILENAME, not mtime. Every run starts with a
          # fresh checkout, which stamps every file's mtime as "now", so
          # `find -mtime +7` matched nothing on the runner and bounded growth in
          # theory only. Media from July is still in the tree because of it.
          python - <<'PRUNE'
          import datetime, glob, os, re
          cutoff = datetime.date.today() - datetime.timedelta(days=7)
          removed = 0
          for path in glob.glob("output/creative/*"):
              m = re.search(r"(\d{4})-(\d{2})-(\d{2})", os.path.basename(path))
              if not m:
                  continue          # no date in the name: leave it alone
              try:
                  stamped = datetime.date(*(int(g) for g in m.groups()))
              except ValueError:
                  continue
              if stamped < cutoff:
                  os.remove(path)
                  removed += 1
          print(f"pruned {removed} creative files older than {cutoff}")
          PRUNE
          git add -f output/creative/ 2>/dev/null || true
          git add -f "output/content_$(date -u +%Y-%m-%d).json" 2>/dev/null || true
          git add -f output/reports/ 2>/dev/null || true
          git add -f output/.running* 2>/dev/null || true
          if ! git diff --staged --quiet; then git commit -m "chore: run ${{ github.run_number }} — validated content + learning data [skip ci]"; fi
          if ! git push; then
            echo "push rejected — rebasing on the remote and retrying"
            git pull --rebase --autostash
            git push || { echo "::error::Could not push validated run state; publish slots cannot load persisted content."; exit 1; }
          fi

      - name: Alert on failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl -s -X POST "$ALERT_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"text\":\"PURITY BEANS PIPELINE FAILED\nRun: ${{ github.run_number }}\nLogs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi
          echo "Pipeline failed — check logs at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
