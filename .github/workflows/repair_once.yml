name: One-time repair — generation state integrity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply source-level fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          gen = Path('content_generator/pipeline/generator.py')
          text = gen.read_text(encoding='utf-8')

          old = '''def save_content(content_data: dict, output_dir: str = "output") -> str:\n    os.makedirs(output_dir, exist_ok=True)\n    date_str = datetime.date.today().isoformat()\n    filepath = os.path.join(output_dir, f"content_{date_str}.json")\n    with open(filepath, "w", encoding="utf-8") as f:\n        json.dump(content_data, f, indent=2, ensure_ascii=False)\n    logger.info("[pipeline] Saved → %s", filepath)\n    return filepath\n'''

          new = '''def save_content(content_data: dict, output_dir: str = "output") -> str:\n    """Persist a validated content payload with an unambiguous run identity."""\n    os.makedirs(output_dir, exist_ok=True)\n    from zoneinfo import ZoneInfo\n    import uuid\n\n    now_ist = datetime.datetime.now(ZoneInfo("Asia/Kolkata"))\n    date_str = now_ist.date().isoformat()\n    if not isinstance(content_data, dict):\n        raise TypeError("content_data must be a dict")\n    if not str(content_data.get("generation_id") or "").strip():\n        source = str(content_data.get("_source") or content_data.get("source") or "generated").strip()\n        prefix = "fallback" if source.startswith("emergency_fallback") else "gen"\n        content_data["generation_id"] = f"{prefix}_{date_str}_{uuid.uuid4().hex[:8]}"\n        logger.info("[pipeline] assigned missing generation_id=%s", content_data["generation_id"])\n    content_data.setdefault("date_iso", date_str)\n    filepath = os.path.join(output_dir, f"content_{date_str}.json")\n    with open(filepath, "w", encoding="utf-8") as f:\n        json.dump(content_data, f, indent=2, ensure_ascii=False)\n    logger.info("[pipeline] Saved → %s", filepath)\n    return filepath\n'''

          if old not in text:
              raise SystemExit('generator.py save_content block not found; refusing blind edit')
          gen.write_text(text.replace(old, new, 1), encoding='utf-8')

          text = gen.read_text(encoding='utf-8')
          old = '    todays_date = datetime.date.today().strftime("%B %d, %Y")\n'
          new = '    from zoneinfo import ZoneInfo\n    todays_date = datetime.datetime.now(ZoneInfo("Asia/Kolkata")).strftime("%B %d, %Y")\n'
          if old not in text:
              raise SystemExit('generator.py date line not found; refusing blind edit')
          gen.write_text(text.replace(old, new, 1), encoding='utf-8')

          fallback = Path('content_generator/scheduler/fallback.py')
          text = fallback.read_text(encoding='utf-8')
          replacements = {
              '"body":   "Purity Beans — 100% pure instant coffee. Rs 18/cup.",': '"body":   "Purity Beans — 100% coffee. Zero chicory, no additives.",',
              '"cta":    "Link in bio.",': '"cta":    "Read the label, then shop at p3online.in",',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          fallback.write_text(text, encoding='utf-8')

          test = Path('tests/test_save_content_identity.py')
          test.write_text('''import json\n\n\ndef test_save_content_assigns_generation_id_to_fallback(tmp_path):\n    from content_generator.pipeline.generator import save_content\n\n    payload = {"day_number": 249, "_source": "emergency_fallback_evergreen", "reels": []}\n    path = save_content(payload, output_dir=str(tmp_path))\n    with open(path, encoding="utf-8") as fh:\n        data = json.load(fh)\n\n    assert data["generation_id"].startswith("fallback_")\n    assert data["day_number"] == 249\n    assert data["date_iso"]\n''', encoding='utf-8')
          PY

      - name: Verify
        run: |
          set -euo pipefail
          python -m py_compile content_generator/pipeline/generator.py content_generator/scheduler/daily.py content_generator/scheduler/fallback.py
          pytest -q tests/

      - name: Commit repair and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "Purity Beans Engine"
          git config user.email "engine@puritybeans.auto"
          rm -f .github/workflows/repair_once.yml
          git add content_generator/pipeline/generator.py content_generator/scheduler/fallback.py tests/test_save_content_identity.py .github/workflows/repair_once.yml
          git commit -m "fix: make persisted generation state unambiguous and IST-safe [skip ci]"
          git push
